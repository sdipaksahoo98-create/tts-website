<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-AI Voice Studio Pro V3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .ad-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .badge {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            padding: 1rem;
            font-size: 1rem;
            resize: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .editor-tools {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        select, input[type="range"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .status-message {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            height: 20px;
        }

        .audio-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        audio {
            width: 100%;
            border-radius: 8px;
        }

        .download-btn {
            text-align: center;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
            text-decoration: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: rgba(16, 185, 129, 0.3);
            color: #ffffff;
        }
    </style>
</head>
<body>
    
    <div class="background-animation"></div>
    
    <div class="app-container">
        <header>
            <h1><i class="fa-solid fa-microphone-lines"></i> Multi-AI Voice Studio Pro (V3)</h1>
            <p class="subtitle">Select from multiple AI Models, Voices & Languages</p>
        </header>

        <!-- ADSTERRA AD SECTION -->
        <div class="ad-container">
            <script src="https://pl30586343.effectivecpmnetwork.com/84/5d/e8/845de8064976fcda27077a2364ad85f5.js"></script>
        </div>

        <main>
            <div class="glass-card editor-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-keyboard"></i> Text Editor</h2>
                    <span id="charCount" class="badge">0 Characters</span>
                </div>
                <textarea id="textInput" placeholder="Type text here to convert into AI voice..."></textarea>
                <div class="editor-tools">
                    <button id="clearBtn" class="tool-btn"><i class="fa-solid fa-trash"></i> Clear</button>
                    <button id="copyBtn" class="tool-btn"><i class="fa-solid fa-copy"></i> Copy</button>
                </div>
            </div>

            <div class="glass-card settings-section">
                <h2><i class="fa-solid fa-sliders"></i> AI Voice & Engine Settings</h2>
                <div class="settings-grid">
                    <div class="control-group">
                        <label for="aiEngine">AI Engine</label>
                        <select id="aiEngine">
                            <option value="sarvam">Sarvam AI Cloud</option>
                            <option value="browser">Browser Native AI (Free / Instant)</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="languageSelect">Language</label>
                        <select id="languageSelect">
                            <option value="hi-IN">Hindi</option>
                            <option value="en-IN">English (India)</option>
                            <option value="bn-IN">Bengali</option>
                            <option value="gu-IN">Gujarati</option>
                            <option value="kn-IN">Kannada</option>
                            <option value="ml-IN">Malayalam</option>
                            <option value="mr-IN">Marathi</option>
                            <option value="od-IN">Odia</option>
                            <option value="pa-IN">Punjabi</option>
                            <option value="ta-IN">Tamil</option>
                            <option value="te-IN">Telugu</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="speakerSelect">Choose AI Voice Model (Sarvam v3)</label>
                        <select id="speakerSelect">
                            <!-- Only valid bulbul:v3 speakers are listed here -->
                            <option value="aayan">Aayan</option>
                            <option value="aditya">Aditya</option>
                            <option value="advait">Advait</option>
                            <option value="amit">Amit</option>
                            <option value="anand">Anand</option>
                            <option value="ashutosh">Ashutosh</option>
                            <option value="dev">Dev</option>
                            <option value="gokul">Gokul</option>
                            <option value="ishita">Ishita</option>
                            <option value="kabir">Kabir</option>
                            <option value="kavitha">Kavitha</option>
                            <option value="kavya">Kavya</option>
                            <option value="manan">Manan</option>
                            <option value="mani">Mani</option>
                            <option value="mohit">Mohit</option>
                            <option value="neha">Neha</option>
                            <option value="niharika">Niharika</option>
                            <option value="pooja">Pooja</option>
                            <option value="priya">Priya</option>
                            <option value="rahul">Rahul</option>
                            <option value="ratan">Ratan</option>
                            <option value="rehan">Rehan</option>
                            <option value="ritu">Ritu</option>
                            <option value="rohan">Rohan</option>
                            <option value="roopa">Roopa</option>
                            <option value="rupali">Rupali</option>
                            <option value="shreya">Shreya</option>
                            <option value="shruti">Shruti</option>
                            <option value="shubh">Shubh</option>
                            <option value="simran">Simran</option>
                            <option value="soham">Soham</option>
                            <option value="suhani">Suhani</option>
                            <option value="sumit">Sumit</option>
                            <option value="sunny">Sunny</option>
                            <option value="tanya">Tanya</option>
                            <option value="tarun">Tarun</option>
                            <option value="varun">Varun</option>
                            <option value="vijay">Vijay</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="paceControl">Speech Speed: <span id="paceValue">1.0</span>x</label>
                        <input type="range" id="paceControl" min="0.5" max="1.5" step="0.1" value="1.0">
                    </div>
                </div>
            </div>

            <div class="action-section">
                <button id="generateBtn" class="primary-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Voice
                </button>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <div class="glass-card player-section" id="playerSection" style="display: none;">
                <h2><i class="fa-solid fa-music"></i> Audio Player & Download</h2>
                <div class="audio-controls">
                    <audio id="audioPlayer" controls></audio>
                    <a id="downloadBtn" class="download-btn" download="ai-voice.wav">
                        <i class="fa-solid fa-download"></i> Download Audio File
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const paceControl = document.getElementById('paceControl');
        const paceValue = document.getElementById('paceValue');
        const generateBtn = document.getElementById('generateBtn');
        const statusMessage = document.getElementById('statusMessage');
        const playerSection = document.getElementById('playerSection');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');
        const aiEngine = document.getElementById('aiEngine');
        const speakerSelect = document.getElementById('speakerSelect');

        textInput.addEventListener('input', () => {
            charCount.innerText = `${textInput.value.length} Characters`;
        });

        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            charCount.innerText = '0 Characters';
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(textInput.value);
            showStatus('Text copied!', '#10b981');
        });

        paceControl.addEventListener('input', () => {
            paceValue.innerText = paceControl.value;
        });

        function showStatus(message, color) {
            statusMessage.style.color = color;
            statusMessage.innerHTML = message;
        }

        generateBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const language = document.getElementById('languageSelect').value;
            const engine = aiEngine.value;
            const speaker = speakerSelect.value;
            const pace = parseFloat(paceControl.value);

            if (!text) {
                showStatus('Please enter text first!', '#ef4444');
                return;
            }

            // Always hide the player section at the start of generation
            playerSection.style.display = 'none';
            audioPlayer.style.display = 'none';
            downloadBtn.style.display = 'none';

            if (engine === 'browser') {
                showStatus('Starting Browser AI...', '#3b82f6');
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language;
                    utterance.rate = pace;

                    utterance.onstart = () => {
                        showStatus('Playing using Free Browser AI (No download available)...', '#10b981');
                    };
                    utterance.onerror = () => {
                        showStatus('Error playing speech.', '#ef4444');
                    };
                    
                    window.speechSynthesis.speak(utterance);
                } else {
                    showStatus('Browser Speech API not supported.', '#ef4444');
                }
            } else if (engine === 'sarvam') {
                showStatus('Generating voice using Sarvam AI...', '#3b82f6');
                
                // IMPORTANT: Place your actual API key below
                const API_KEY = 'sk_zromi20f_vJg5peRt8ramvZ4o2rcYpKRJ'; 
                
                try {
                    const response = await fetch('https://api.sarvam.ai/text-to-speech', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'api-subscription-key': API_KEY
                        },
                        body: JSON.stringify({
                            inputs: [text],
                            target_language_code: language,
                            speaker: speaker, 
                            pace: pace,
                            model: "bulbul:v3"
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.text();
                        alert("Server Error Code: " + response.status + "\nDetails: " + errorData);
                        throw new Error(errorData);
                    }
                    
                    const data = await response.json();
                    if (data && data.audios) {
                        const audioUrl = `data:audio/wav;base64,${data.audios[0]}`;
                        audioPlayer.src = audioUrl;
                        audioPlayer.style.display = 'block';
                        downloadBtn.href = audioUrl;
                        downloadBtn.style.display = 'flex';
                        playerSection.style.display = 'block'; // Unhide only when audio is ready
                        showStatus(`Voice generated successfully!`, '#10b981');
                    }
                } catch (err) {
                    console.error("API Error:", err);
                    showStatus('Generation failed. Please try again.', '#ef4444');
                }
            }
        });
    </script>
</body>
</html>
